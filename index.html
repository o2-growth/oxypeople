<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oxy People - Gestão de Pessoas</title>
    <meta name="description" content="Oxy People - Plataforma moderna de gestão de pessoas, engajamento e cultura organizacional" />
    <meta name="author" content="Oxy People" />

    <!-- Fonts -->
    <!--
      O2 Brand Typography (Phase 1 - Design System Migration)
      - display: Tusker Grotesk (TODO: self-host .woff2 from O2 Drive). Anton + Barlow Condensed are loaded as visually compatible fallbacks until Tusker is installed.
      - body: Montserrat
      - mono: JetBrains Mono (300-600)
      Inter + Space Grotesk are intentionally retained for back-compat during the migration; remove in a follow-up PR once no consumer references them.
      See: docs/design-system-migration.md (§ 5)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:title" content="Oxy People - Gestão de Pessoas" />
    <meta property="og:description" content="Plataforma moderna de gestão de pessoas, engajamento e cultura organizacional" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@OxyPeople" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <script>
      // Prevent theme flash - apply saved theme immediately to <html>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
